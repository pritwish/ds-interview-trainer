name: DSInterviewer

options:
  bundleIdPrefix: com.dsinterviewer
  deploymentTarget:
    iOS: "17.0"

targets:
  DSInterviewer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DSInterviewer
        excludes:
          - Package.swift
    info:
      path: DSInterviewer/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsinterviewer.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
